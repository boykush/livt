<script>
  try {
    if (window.self === window.top && localStorage.getItem("livt.mapping-view") === "list") {
      document.documentElement.setAttribute("data-view", "list");
    }
  } catch (e) {}

<style>
  .rule-card:target, .example-card:target, .question-card:target {
    box-shadow: 0 0 0 2px #fff, 0 0 0 5px #7c3aed;
    animation: ruleFlash 1.1s ease-out 1;
  }
  @keyframes ruleFlash {
    0%       { box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgba(124, 58, 237, 0); }
    30%, 65% { box-shadow: 0 0 0 2px #fff, 0 0 0 9px rgba(124, 58, 237, 0.9); }
    100%     { box-shadow: 0 0 0 2px #fff, 0 0 0 5px #7c3aed; }
  }

  .mapping { display: grid; grid-auto-flow: column; grid-auto-columns: 180px; gap: 0.5rem 1rem; min-width: max-content; }
  .rule-group, .question-group { display: contents; }
  .rule-card, .question-head { grid-row: 1; }
  .example-stack, .question-stack { grid-row: 2; align-self: start; display: flex; flex-direction: column; gap: 0.5rem; }
  .rule-fold, .example-count, .list-head { display: none; }
  .rule-fold .chevron { display: inline-block; transition: transform 0.15s; }
  .rule-fold[aria-expanded="true"] .chevron { transform: rotate(90deg); }
  html:not([data-view="list"]) [data-view-toggle="board"],
  html[data-view="list"] [data-view-toggle="list"] { background-color: #4b5563; border-color: #4b5563; color: #fff; }

  
  [data-view="list"] .mapping { display: flex; flex-direction: column; gap: 0.75rem; min-width: 0; max-width: 48rem; }
  [data-view="list"] .rule-group, [data-view="list"] .question-group { display: block; }
  [data-view="list"] .list-head { display: flex; }
  [data-view="list"] .question-group .list-head { margin-top: 1.5rem; }
  [data-view="list"] .question-head { display: none; }
  [data-view="list"] :is(.rule-card, .example-card, .question-card) {
    display: flex; align-items: baseline; gap: 0.5rem; padding: 1rem 1.25rem;
    background-color: #fff; border-width: 1px 1px 1px 4px; border-radius: 0.5rem;
    border-top-color: #e5e7eb; border-right-color: #e5e7eb; border-bottom-color: #e5e7eb;
  }
  [data-view="list"] :is(.rule-card, .example-card, .question-card):not(:target) { box-shadow: none; }
  [data-view="list"] [data-foldable] > .rule-card:hover { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
  
  [data-view="list"] .proposed, [data-view="list"] .ghost { border-style: solid solid solid dashed; }
  
  .ghost .sticky-text { text-decoration: line-through; text-decoration-color: #9ca3af; }
  [data-view="list"] :is(.rule-card, .question-card):not(.proposed) { color: #111827; }
  [data-view="list"] .question-card { font-size: 1rem; }
  [data-view="list"] .example-card { padding: 0.625rem 1.25rem; }
  [data-view="list"] .mapping [data-copy-link],
  [data-view="list"] .proposed-badge { position: static; flex-shrink: 0; box-shadow: none; }
  [data-view="list"] .mapping [data-copy-link], [data-view="list"] :is(.rule-automations, .rule-issues, .example-automations) { font-size: 0.75rem; }
  [data-view="list"] .proposed-badge { font-size: 0.75rem; padding: 0.125rem 0.5rem; }
  [data-view="list"] :is(.rule-body, .example-body) { flex: 1; min-width: 0; }
  [data-view="list"] .rule-fold, [data-view="list"] .example-count { display: inline-flex; }
  [data-view="list"] [data-foldable] > .rule-card { cursor: pointer; }
  [data-view="list"] .example-stack { display: none; margin: 0.5rem 0 0 1.75rem; gap: 0.5rem; }
  [data-view="list"] [data-open] > .example-stack { display: flex; }
  [data-view="list"] .question-stack { margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.75rem; }
</style>

<script>
  document.querySelectorAll('a[data-copy-link]').forEach(function (a) {
    a.addEventListener('click', function () {
      if (!navigator.clipboard) return;
      var url = location.href.split('#')[0] + a.getAttribute('href');
      navigator.clipboard.writeText(url).then(function () {
        var label = a.textContent;
        a.textContent = "✓ コピーしました";
        setTimeout(function () { a.textContent = label; }, 1200);
      });
    });
  });
</script>


<script>
(function () {
  var root = document.documentElement;
  var foldable = document.querySelectorAll("[data-foldable]");

  function listing() {
    return root.getAttribute("data-view") === "list";
  }

  function show(view) {
    if (view === "list") root.setAttribute("data-view", "list");
    else root.removeAttribute("data-view");
    document.querySelectorAll("[data-view-toggle]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-view-toggle") === view));
    });
  }

  function fold(group, open) {
    if (open) group.setAttribute("data-open", "");
    else group.removeAttribute("data-open");
    group.querySelector("[data-fold]").setAttribute("aria-expanded", String(open));
  }

  
  
  function reveal() {
    var id = location.hash.slice(1);
    try { id = decodeURIComponent(id); } catch (e) {}
    var target = id && document.getElementById(id);
    var group = target && target.closest(".example-stack") && target.closest("[data-foldable]");
    if (!group || group.hasAttribute("data-open")) return;
    fold(group, true);
    target.scrollIntoView();
  }

  document.querySelectorAll("[data-view-toggle]").forEach(function (b) {
    b.addEventListener("click", function () {
      var view = b.getAttribute("data-view-toggle");
      show(view);
      try { localStorage.setItem("livt.mapping-view", view); } catch (e) {}
    });
  });

  
  
  foldable.forEach(function (group) {
    group.querySelector(".rule-card").addEventListener("click", function (e) {
      if (!listing() || e.target.closest("a") || String(window.getSelection())) return;
      fold(group, !group.hasAttribute("data-open"));
    });
  });

  window.addEventListener("hashchange", reveal);
  show(listing() ? "list" : "board");
  reveal();
})();
</script>
