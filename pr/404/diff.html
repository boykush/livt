<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>livt - 差分</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  
  .diff-del { background-color: #fee2e2; text-decoration: line-through; text-decoration-color: #b91c1c; }
  .diff-add { background-color: #dcfce7; }
  .diff-del .moved { background-color: #fca5a5; }
  .diff-add .moved { background-color: #86efac; }
  .diff-del .moved, .diff-add .moved { border-radius: 0.125rem; }
  .diff-del .moved { text-decoration: line-through; text-decoration-color: #b91c1c; }
  .reworded { background-color: transparent; text-decoration: none; }
  .ghost { border-style: dashed; box-shadow: none; opacity: 0.8; }
  .diff-card.nested:target { box-shadow: 0 0 0 2px #fff, 0 0 0 5px #7c3aed; }
  [data-nav][aria-current="true"] { background-color: #f5f3ff; box-shadow: inset 3px 0 0 #7c3aed; font-weight: 600; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<div class="min-h-screen flex flex-col">
  <header class="bg-white border-b border-gray-200 px-8 py-4 flex flex-wrap items-center gap-x-4 gap-y-2">
    <a href="index.html" class="text-xl font-bold text-gray-900 tracking-tight">livt</a>
    <h2 class="text-lg font-semibold text-gray-800">差分</h2>
    <span class="text-sm font-mono text-gray-500">b0c0b9f &rarr; 635d12c</span>
    <div class="ml-auto flex items-center gap-2 text-xs">
      <span class="rounded-full px-2.5 py-1 bg-green-50 text-green-700 border border-green-200">追加 0</span>
      <span class="rounded-full px-2.5 py-1 bg-amber-50 text-amber-700 border border-amber-200">変更 0</span>
      <span class="rounded-full px-2.5 py-1 bg-red-50 text-red-700 border border-red-200">廃止 0</span>
    </div>
  </header>
  
  <p class="px-8 py-8 text-gray-400">このリビジョン間に変更はありません。</p>
  
</div>
<script>
  (function () {
    var items = Array.prototype.slice.call(document.querySelectorAll("[data-item]"));
    if (!items.length) return;
    var links = document.querySelectorAll("[data-nav]");
    var pager = document.querySelector("[data-pager]");
    var position = document.querySelector("[data-position]");
    var current = 0;
    function show(id, scroll) {
      var target = id && document.getElementById(id);
      var item = target ? target.closest("[data-item]") : null;
      current = Math.max(0, items.indexOf(item));
      items.forEach(function (el, i) { el.hidden = i !== current; });
      links.forEach(function (a) { a.setAttribute("aria-current", String(a.getAttribute("href") === "#" + items[current].dataset.item)); });
      pager.hidden = false;
      position.textContent = (current + 1) + " / " + items.length;
      if (target && target.id !== items[current].dataset.item) target.scrollIntoView({ block: "center" });
      else if (scroll) window.scrollTo(0, 0);
    }
    pager.addEventListener("click", function (e) {
      var step = e.target.closest("[data-step]");
      if (!step) return;
      var next = (current + Number(step.dataset.step) + items.length) % items.length;
      location.hash = items[next].dataset.item;
    });
    window.addEventListener("hashchange", function () { show(decodeURIComponent(location.hash.slice(1)), true); });
    show(decodeURIComponent(location.hash.slice(1)), false);
  })();
</script>
</body>
</html>
