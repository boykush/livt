{{/*
What changed here and is no longer here to be marked: an item deleted, or
retired and so off the board. The count is the only thing this page can honestly
say about it — the item itself is in the diff, which is where the link goes.
*/}}
{{define "diff-gone"}}
<a href="{{.Href}}" class="inline-flex items-center gap-1.5 text-xs text-red-700 bg-red-50 border border-red-200 rounded-full px-3 py-1 hover:bg-red-100 transition">
  <span class="font-semibold">{{.Count}}</span>{{.Label}}
</a>
{{end}}
