<!DOCTYPE html>
<html lang="{{t "lang.code"}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>livt - {{t "nav.story-maps"}}</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* iframe preview: crop the page header so only the board shows */
  .thumb { position: relative; overflow: hidden; background: #fff; }
  .thumb iframe { position: absolute; left: 0; border: 0; pointer-events: none; transform-origin: top left;
    width: 400%; height: 1400px; transform: scale(0.25); top: -15px; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="flex min-h-screen">
{{template "sidebar" .Sidebar}}
<div class="flex-1 min-w-0">
  <header class="bg-white border-b border-gray-200 px-8 py-4">
    <h2 class="text-lg font-semibold text-gray-800">{{t "nav.story-maps"}}</h2>
  </header>
  <main class="px-8 py-8 space-y-6">
  {{range .StoryMaps}}
    <a href="story-map/{{.Name}}.html" class="block rounded-xl border border-purple-200 bg-white shadow-sm overflow-hidden hover:shadow-md transition">
      <div class="flex items-center gap-2 px-4 py-2.5 border-b border-purple-100 bg-purple-50">
        <span class="w-2.5 h-2.5 rounded-sm bg-purple-400"></span>
        <span class="text-sm font-semibold text-purple-900">{{.Name}}</span>
        <span class="ml-auto text-purple-400 text-sm">&rarr;</span>
      </div>
      <div class="thumb" style="height: 260px;">
        <iframe src="story-map/{{.Name}}.html" scrolling="no" loading="lazy"></iframe>
      </div>
    </a>
  {{else}}
    <p class="text-gray-400 text-sm">{{t "empty.story-maps"}}</p>
  {{end}}
  </main>
</div>
</div>
</body>
</html>
