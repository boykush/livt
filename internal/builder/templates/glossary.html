<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubiquitous Language - livt</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
<header class="bg-white border-b border-gray-200">
  <div class="max-w-5xl mx-auto px-6 py-4 flex items-center gap-3">
    <a href="index.html" class="text-sm text-gray-400 hover:text-gray-600">&larr; Stories</a>
    <span class="text-gray-300">|</span>
    <span class="text-xl font-bold text-gray-900 tracking-tight">livt</span>
  </div>
</header>

<main class="max-w-5xl mx-auto px-6 py-8">
<h2 class="text-lg font-semibold text-gray-700 mb-4">Ubiquitous Language</h2>

{{if .Terms}}
<div class="overflow-x-auto bg-white rounded-lg border border-gray-200">
<table class="w-full text-left border-collapse">
  <thead>
    <tr class="border-b border-gray-200 bg-gray-50 text-xs font-semibold uppercase tracking-wide text-gray-500">
      <th class="px-5 py-3 w-1/5">Term</th>
      <th class="px-5 py-3 w-1/5">Key</th>
      <th class="px-5 py-3">Definition</th>
    </tr>
  </thead>
  <tbody>
  {{range .Terms}}
    <tr id="{{.Key}}" class="border-b border-gray-100 last:border-0 align-top target:bg-pink-50 hover:bg-gray-50">
      <td class="px-5 py-3 border-l-4 border-pink-300 font-medium text-gray-900">{{.Name}}</td>
      <td class="px-5 py-3 text-xs font-mono text-pink-600">{{.Key}}</td>
      <td class="px-5 py-3 text-sm text-gray-700 whitespace-pre-wrap leading-relaxed">{{.Definition}}</td>
    </tr>
  {{end}}
  </tbody>
</table>
</div>
{{else}}
<p class="text-gray-400 text-sm">No terms found.</p>
{{end}}
</main>
</body>
</html>
