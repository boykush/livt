<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>livt - Stories</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="flex min-h-screen">
{{template "sidebar" .Sidebar}}
<div class="flex-1 min-w-0">
  <header class="bg-white border-b border-gray-200 px-8 py-4">
    <h2 class="text-lg font-semibold text-gray-800">Stories</h2>
  </header>
  <main class="px-8 py-8 max-w-3xl">
  {{range .Stories}}
    <a href="story/{{.Key}}.html" class="block bg-white rounded-lg border border-gray-200 px-5 py-4 mb-3 hover:border-yellow-300 hover:shadow-sm transition">
      <span class="text-base font-medium text-gray-900">{{.Name}}</span>
      <span class="block text-xs text-gray-400 mt-1">{{.Key}}</span>
    </a>
  {{else}}
    <p class="text-gray-400 text-sm">No stories found.</p>
  {{end}}
  </main>
</div>
</div>
</body>
</html>
