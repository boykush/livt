name: 実例マッピング自体に名前を付ける

rules:
  - id: R-01
    name: 実例マッピングは自分の名前を持てる
    examples:
      - id: EX-01
        name: ストーリーのない実例マッピングに付けた名前が、ボードの黄色い付箋・一覧のタイル・タスクページに出る
      - id: EX-02
        name: 名前もストーリーもない実例マッピングは、キーで呼ばれる
  - id: R-02
    name: livtは、実例マッピングの名前とストーリーの名前を独立に扱う
    examples:
      - id: EX-01
        name: 名前のない実例マッピングは、これまでどおりストーリーの名前で呼ばれる
      - id: EX-02
        name: ストーリーのある実例マッピングに名前を付けると、ボードは付けた名前で呼ばれ、ストーリーページはストーリーの名前のまま
      - id: EX-03
        name: 名前を付けても、ストーリーがあればボードの黄色い付箋はストーリーページへリンクする
  - id: R-03
    name: 名前の変更は、差分に実例マッピングの変更として出る
    examples:
      - id: EX-01
        name: 名前を変えると、差分の実例マッピングに旧い名前と新しい名前が並ぶ
  - id: R-04
    name: MCPとlivt resolveは、実例マッピングの名前を返す
    examples:
      - id: EX-01
        name: 名前のある実例マッピングを読むと、nameが返る
      - id: EX-02
        name: 名前のない実例マッピングには、nameが載らない
  - id: R-05
    name: ストーリーと実例マッピングの両方が名前を持つとき、2つは同じ名前にする（揃えるのはAIスキルで、livt本体は比べない）
    examples:
      - id: EX-01
        name: 名前付きの実例マッピングがあるキーにストーリーカードを書くとき、文言が食い違えば、どちらを採るかをユーザーに確かめて両方に書く
      - id: EX-02
        name: ストーリーカードのある盤面を記録するときは、実例マッピングに名前を書かない

questions:
  - id: Q-01
    text: ストーリーのない実例マッピングを、実装リポジトリのエージェントはどう見つけるか（MCPのlist_storiesはストーリーからしか辿らない）

ubiquitous:
  - example-mapping
  - story
