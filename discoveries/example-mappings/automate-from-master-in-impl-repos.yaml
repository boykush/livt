rules:
  - id: R-01
    name: livtはマスタをMCPサーバーとして公開し、消費側はlivtのソースを読まずに仕様を取得する
    examples:
      - id: EX-01
        name: livt mcp コマンドでstdioのMCPサーバーが起動する
      - id: EX-02
        name: 消費側エージェントはツール/リソース経由で実例マッピング・ルールを取得する
  - id: R-02
    name: 実装リポジトリは別ディレクトリにあるマスタの場所を指定できる
    examples:
      - id: EX-01
        name: 環境変数 LIVT_ROOT でマスタのルートディレクトリを指定する
      - id: EX-02
        name: CLI引数 --root が環境変数より優先される
      - id: EX-03
        name: いずれも未指定ならカレントディレクトリをルートとする
  - id: R-03
    name: 各レスポンス（ツール・リソース）はマスタのバージョン（gitリビジョン）を返し、仕様のズレを防ぐ
    examples:
      - id: EX-01
        name: 出力に spec_version としてマスタのgit HEAD（rev-parse --short の短縮リビジョン）が含まれる
      - id: EX-02
        name: マスタがgitリポジトリでない場合 spec_version は空になる
  - id: R-04
    name: 実装リポジトリはストーリー単位で実例マッピングをリソースとして取得できる
    examples:
      - id: EX-01
        name: resources/templates/list に livt://mapping/{story_key} が現れる
      - id: EX-02
        name: resources/read livt://mapping/{story_key} でルール・実例・質問を取得する
      - id: EX-03
        name: 各ルールは自分のリソースURI（livt://mapping/{story_key}/rule/{rule_id}）を持つ
  - id: R-05
    name: 実装リポジトリはルール単位で仕様をリソースとして取得できる
    examples:
      - id: EX-01
        name: resources/read livt://mapping/{story_key}/rule/{rule_id} で単一ルールと実例を取得する
      - id: EX-02
        name: 存在しないキーやルールIDのURIは not found を返す
  - id: R-06
    name: 実装リポジトリは利用可能なストーリーの一覧を取得できる
    examples:
      - id: EX-01
        name: list_stories で全ストーリーのキーと名前を取得する
      - id: EX-02
        name: 各エントリは実例マッピングがあれば、そのリソースURI（livt://mapping/{key}）を示す
  - id: R-07
    name: 消費側は stdio で livt mcp をサブプロセスとして起動し、消費者ごとに1対1で接続する
    examples:
      - id: EX-01
        name: クライアントが livt mcp をサブプロセスとして spawn し、標準入出力で接続する
      - id: EX-02
        name: マスタの場所は --root / LIVT_ROOT で指す（消費側に別チェックアウトが要る）
      - id: EX-03
        name: 1消費者につき1プロセスで、サーバーは共有しない
  - id: R-08
    name: 消費側は常駐する1つの livt mcp --http サーバーをURL参照で共有する
    examples:
      - id: EX-01
        name: マスタ側で livt mcp --http localhost:5488 を常駐起動する
      - id: EX-02
        name: 複数リポジトリが http://localhost:5488/mcp を共有参照し、per-repo の LIVT_ROOT は不要
      - id: EX-03
        name: ステートレス・読み取り専用なので1プロセスで複数クライアントを捌く
  - id: R-09
    name: 実装リポジトリはストーリーマップをリソースとして取得できる
    examples:
      - id: EX-01
        name: list_story_maps で全ストーリーマップの名前とリソースURI（livt://story-map/{map_name}）を取得する
      - id: EX-02
        name: resources/read livt://story-map/{map_name} でアクティビティ・ステップ・ストーリーカード・リリースを取得する
      - id: EX-03
        name: マップ名はビルド出力（story-map/{name}.html）と同じ表示名で、URI上はパーセントエンコードして表す
      - id: EX-04
        name: 存在しないマップ名は not found を返す
  - id: R-10
    name: 実装リポジトリはストーリー本文をリソースとして取得できる
    examples:
      - id: EX-01
        name: resources/read livt://story/{story_key} でストーリーの名前・本文・frontmatterメタ（例 issue）を取得する
      - id: EX-02
        name: list_stories の各エントリとストーリーマップ内のストーリーカードは、ストーリーのリソースURI（livt://story/{story_key}）を示す
      - id: EX-03
        name: 実例マッピングがあるストーリーは、そのリソースURI（livt://mapping/{story_key}）も示す
      - id: EX-04
        name: 存在しないストーリーキーは not found を返す
  - id: R-11
    name: 実装リポジトリはユビキタス言語の用語をリソースとして取得できる
    examples:
      - id: EX-01
        name: resources/read livt://ubiquitous/{term_key} で用語の名前と定義本文を取得する
      - id: EX-02
        name: 実例マッピング・ストーリーマップのレスポンスは ubiquitous の各用語キーに解決済みの名前とリソースURIを添える（既存の ubiquitous フィールドはそのまま維持する）
      - id: EX-03
        name: 用語ファイルがないキーはURIなしでキーのみを示す
      - id: EX-04
        name: 存在しない用語キーは not found を返す
  - id: R-12
    name: 公開対象の一覧はツールとリソーステンプレートで提供し、concrete resources と変更通知には広げない
    examples:
      - id: EX-01
        name: resources/templates/list に全リソーステンプレート（mapping・rule・story-map・story・ubiquitous）が現れる
      - id: EX-02
        name: resources/list への concrete resources 掲載や subscribe は提供せず、毎リクエスト読みのステートレスを保つ
      - id: EX-03
        name: 消費側はマスタの更新を spec_version の変化で検知する

questions:
  - id: Q-05
    text: ネットワーク（非ローカル）公開する場合の認証・公開モデルをどうするか（現状はローカル利用前提で認証なし）

ubiquitous:
  - example-mapping
  - story
  - story-map
  - ubiquitous-language
  - discovery
