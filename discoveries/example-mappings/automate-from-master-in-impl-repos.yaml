rules:
  - id: R-01
    name: livtはマスタをMCPサーバーとして公開し、消費側はlivtのソースを読まずに仕様を取得する
    examples:
      - id: EX-01
        name: livt mcp コマンドでstdioのMCPサーバーが起動する
      - id: EX-02
        name: 消費側エージェントはツール経由で実例マッピング/ルールを取得する
  - id: R-02
    name: 実装リポジトリは別ディレクトリにあるマスタの場所を指定できる
    examples:
      - id: EX-01
        name: 環境変数 LIVT_ROOT でマスタのルートディレクトリを指定する
      - id: EX-02
        name: CLI引数 --root が環境変数より優先される
      - id: EX-03
        name: いずれも未指定ならカレントディレクトリをルートとする
  - id: R-03
    name: 各ツールはマスタのバージョン（gitリビジョン）を返し、仕様のズレを防ぐ
    examples:
      - id: EX-01
        name: ツール出力に spec_version としてマスタのgit HEADが含まれる
      - id: EX-02
        name: マスタがgitリポジトリでない場合 spec_version は空になる
  - id: R-04
    name: 実装リポジトリはストーリー単位で実例マッピングを取得できる
    examples:
      - id: EX-01
        name: get_example_mapping(story_key) でそのストーリーのルール・実例・質問を取得する
      - id: EX-02
        name: 未知のstory_keyを指定するとnot foundエラーになる
  - id: R-05
    name: 実装リポジトリはルール単位で仕様（ルールと実例）を取得できる
    examples:
      - id: EX-01
        name: get_rule(story_key, rule_id) で単一ルールとその実例を取得する
      - id: EX-02
        name: 未知のrule_idを指定するとnot foundエラーになる
  - id: R-06
    name: 実装リポジトリは利用可能なストーリーの一覧を取得できる
    examples:
      - id: EX-01
        name: list_stories で全ストーリーのキーと名前を取得する
      - id: EX-02
        name: 各エントリは実例マッピングの有無（has_example_mapping）を示す
questions:
  - id: Q-01
    text: get_example_mapping / get_rule / list_stories 以外に公開するツールをどこまで足すか（get_story / story-map系 / term系を1 tool 1 ruleで順次検討）
  - id: Q-02
    text: 受動的コンテキスト添付のためのResource（livt://story/{key} 等）を公開するか
  - id: Q-03
    text: stdioに加えてHTTP transportを提供する必要があるか
  - id: Q-04
    text: spec_versionはgitの短縮revか、タグ込みのgit describeか

ubiquitous:
  - example-mapping
  - story
  - discovery
