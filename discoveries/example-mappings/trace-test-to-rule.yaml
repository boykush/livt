rules:
  - id: R-01
    name: 仕様の一点はlivt URIで一意に指せる
    examples:
      - id: EX-01
        name: ルールは livt://mapping/{story-key}/rule/{rule-id}
      - id: EX-02
        name: 具体例は livt://mapping/{story-key}/rule/{rule-id}/example/{example-id}（具体例IDはルール内採番のため、ルールを含める）
      - id: EX-03
        name: 疑問点は livt://mapping/{story-key}/question/{question-id}
      - id: EX-04
        name: 裸のR-02は10個のマッピング全部に存在し、単体ではどのマッピングか復元できない
    automated: true
  - id: R-02
    name: livt URIはデプロイ先に依存しない
    examples:
      - id: EX-01
        name: 保存するのはlivt URIで、デプロイ先URLは描画時にだけ前置される
      - id: EX-02
        name: livt URIからページ内アンカーへの導出規則は文書化され、SSGとCLIで同一
      - id: EX-03
        name: 人が共有するURLはボードから、成果物に残すlivt URIはCLIから取る
    automated: true
  - id: R-03
    name: どの付箋も自分のIDを示し、そのリンクをコピーできる
    examples:
      - id: EX-01
        name: ルール・具体例・疑問点の各カード右下にIDが薄字で出る
      - id: EX-02
        name: クリックでコピーされるのはデプロイ済みURL
      - id: EX-03
        name: 表示はカード色に追従するモノクロで、絵文字は使わない
    automated: true
  - id: R-04
    name: livt URIはCLIから解決できる
    examples:
      - id: EX-01
        name: ルール・具体例・疑問点・ストーリー・ストーリーマップ・用語のいずれも解決できる
      - id: EX-02
        name: 出力はMCPのリソース読み出しと同じJSON形状
      - id: EX-03
        name: デプロイ済みURLの形でも出せる
    automated: true
  - id: R-05
    name: 退役した項目は削除せずretiredとして残り、livt URIは「退役」として解決する
    examples:
      - id: EX-01
        name: 退役したルールのlivt URIは404ではなくretiredとして解決する
      - id: EX-02
        name: 退役した付箋はボードにもTasksページにも出ない
      - id: EX-03
        name: 本文を残すので、退役した内容が後から読める
      - id: EX-04
        name: YAMLのコメントアウトでは代用しない（構造的な編集でコメントは消えるため）
    automated: true
  - id: R-06
    name: 新しいIDはretiredを含めたmax + 1で採番する
    examples:
      - id: EX-01
        name: R-01/R-02/R-03からR-03を退役させても、次のルールはR-04
      - id: EX-02
        name: ルール・具体例・疑問点のいずれも同じ規則
  - id: R-07
    name: 一度使われたIDは、指す対象を変えない
    examples:
      - id: EX-01
        name: 具体例を別のルールへ付け替えるとIDが変わるので、外部参照済みの具体例は付け替えない
      - id: EX-02
        name: 再転記でも既存のIDを維持する
      - id: EX-03
        name: Issue起票の有無は関係ない（MCPのURI・ボードのリンク・テストのコメントも参照元）

  - id: R-08
    name: livt URIはlivtリポジトリ相対の名前で、どのリポジトリかは運ばない
    examples:
      - id: EX-01
        name: 同じURIはどこでも「手元のlivtリポジトリの一点」と一様に解釈され、指す実体は手元のリポジトリに依る
      - id: EX-02
        name: どのlivtリポジトリへ解決するかは消費側workspaceの宣言が供給する（automate-from-master-in-impl-repos側のルール）
      - id: EX-03
        name: 第1セグメントは予約語（mapping・story・story-map・ubiquitous）で、将来エイリアスを第1セグメントに置く拡張の席を空けてある

  - id: R-09
    name: 退役した項目は代替先をlivt URIで示し、そこから現行の仕様へ辿り直せる
    examples:
      - id: EX-01
        name: ルール・具体例・疑問点のいずれもsuperseded_byで代替先を示せる
      - id: EX-02
        name: ルール化されて閉じた疑問点は、そのルールを代替先に指す（別の実例マッピングのルールでもよい）
      - id: EX-03
        name: 1つの項目が複数に分かれたときは、代替先を並べて示す
      - id: EX-04
        name: 代替先のない退役（単に不要になった）はsuperseded_byを持たない
      - id: EX-05
        name: 退役の経緯はYAMLに書かず、コミット・PR本文に残す（構造にするのは代替先だけ）
      - id: EX-06
        name: MCPは代替先をURIのまま返し、その本文までは展開しない（辿るかどうかは消費側が決める）
    automated: true

questions:
  - id: Q-01
    text: 実装リポジトリからlivtリポジトリをどう引くか（R-04はCLIに解決機構があることまでで、どこから解決できるかは誰も引き受けていない。現状は--rootでlivtリポジトリのチェックアウトを指す必要があり、実装が別リポジトリにある本ストーリーのアクターは辿れない）
    retired: true
    superseded_by:
      - livt://mapping/automate-from-master-in-impl-repos/rule/R-15
  - id: Q-02
    text: 1つのworkspaceが複数のlivtリポジトリを消費するとき、裸のlivt URIのスコープを何が復元するか（default宣言＋エイリアス修飾のxmlns型が候補。現時点では考慮外とし、R-08 EX-03で拡張の席だけ確保している）
  - id: Q-03
    text: 代替先URIの妥当性を検証するか（現状は解決しないURIも素通しする。未コミットのubiquitous参照を素通しで見せるのと揃えてはいるが、退役の代替先は誰の目にも触れないまま壊れうる）

ubiquitous:
  - livt-uri
  - livt-repository
  - example-mapping
  - story
  - discovery
