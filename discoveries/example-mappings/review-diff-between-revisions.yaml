rules:
  - id: R-01
    name: 差分は、リビジョンを渡したビルドのときだけ現れる
    examples:
      - id: EX-01
        name: リビジョンを渡さないビルドは、これまでと同じサイトを出す
      - id: EX-02
        name: 2つのリビジョンを渡すと差分のページが増える
      - id: EX-03
        name: リビジョンが1つなら、そのリビジョンと手元の作業ツリーの差分になる
      - id: EX-04
        name: gitリポジトリでない場所や解決できないリビジョンを渡すと、ビルドはその場で失敗する
  - id: R-02
    name: 差分の単位はlivt URIで、リソースの種類ごとにまとまって並ぶ
    examples:
      - id: EX-01
        name: ルールの文言が変わると、そのルールのURIが1件として並ぶ
      - id: EX-02
        name: ルールが1件増えると、そのURIが1件として並び、親の実例マッピングは重ねて並ばない
      - id: EX-03
        name: オポチュニティからユビキタス言語の用語まで、どの種類のURIも同じように並ぶ
      - id: EX-04
        name: どちらのリビジョンでも変わっていないURIは並ばない
      - id: EX-05
        name: ルール・具体例・疑問点は、属する実例マッピングの下にまとまる
  - id: R-03
    name: 差分は追加・削除・変更の3通りで、git diffと同じ赤緑で読める
    examples:
      - id: EX-01
        name: 追加されたURIは緑、削除されたURIは赤で並ぶ
      - id: EX-02
        name: 文言が変わったURIは、変わった行だけが赤と緑の対で並ぶ
      - id: EX-03
        name: 変わっていない行は、前後の地として同じ場所に残る
      - id: EX-04
        name: ページの先頭に、追加・削除・変更がそれぞれ何件かが出る
  - id: R-04
    name: ボードが隠している変更も、差分には映る
    examples:
      - id: EX-01
        name: ルールが退役すると、削除ではなく、退役したという変更として並ぶ
      - id: EX-02
        name: 提案中のルールが合意されると、statusの1行の変更として並ぶ
      - id: EX-03
        name: どちらのリビジョンでも退役したままの項目は、差分に出ない
  - id: R-05
    name: 差分とそのURIのページは、互いに辿れる
    examples:
      - id: EX-01
        name: 追加・変更されたURIは、そのURIが着地するページへ辿る
      - id: EX-02
        name: 削除されたURIは、辿る先を持たない
      - id: EX-03
        name: 変わったURIのページにはその場で印が付き、差分の該当箇所へ着地する
      - id: EX-04
        name: 差分はサイドバーに項目を持たない（リソースの種別ではなく、リソースに付く注釈だから）
      - id: EX-05
        name: 消えて印の付けようがないものは、それが載っていた一覧やボードが件数で告げる（削除と、退役してボードから外れたもの）
  - id: R-06
    name: 差分はYAMLの綴りではなく、仕様の言葉で読める
    examples:
      - id: EX-01
        name: ルール・具体例・疑問点・用語の本文は、キーを伴わずその文だけが並ぶ
      - id: EX-02
        name: 状態や自動化のようなlivtが持つ項目は、サイトが使っている言葉で並ぶ
      - id: EX-03
        name: 文言が変わった行は、行のどこが変わったかが中で際立つ

questions:
  - id: Q-01
    text: 差分を載せたサイトを公開するか（いまのサイトはGitHub Pagesへ公開される。差分はレビューのあいだだけのものなので、同じ出力先に出していいか）
  - id: Q-02
    text: レビュアーは手元でビルドを走らせるのか、PRから差分に辿り着けるべきか（後者ならCIとプレビューの公開が要る）
  - id: Q-03
    text: ビルドがgitリポジトリを要るようになることをどう置くか（いまのビルドはYAMLとMarkdownしか読まない。livt://mapping/show-opportunity-progress/question/Q-03 が同じ問いを別の入口から挙げている）
    retired: true
    superseded_by:
      - livt://mapping/review-diff-between-revisions/rule/R-01
  - id: Q-04
    text: 付箋の並び替えだけの変更を差分として映すか（livt URIは変わらないが、ボードの見えは変わる）

ubiquitous:
  - livt-uri
  - livt-repository
  - example-mapping
