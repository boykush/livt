rules:
  - id: R-01
    name: ルールは、参照するポリシーを policies に livt URI で持てる
    examples:
      - id: EX-01
        name: trace-test-to-rule の R-03 が、policies に livt://policy/id-stickies-show-id-and-link を持つ
  - id: R-02
    name: policies は任意で、書かれていないルールには何も求めない
    examples:
      - id: EX-01
        name: 今あるルールは、何も書かずにそのまま読める
  - id: R-03
    name: MCP と livt resolve は、ルールが参照するポリシーを名前付きで返す
    examples:
      - id: EX-01
        name: ルールを引くと、参照先のポリシーの URI と名前が付いてくる

ubiquitous:
  - policy
  - example-mapping
  - livt-uri
