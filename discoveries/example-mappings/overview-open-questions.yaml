rules:
  - id: R-01
    name: 未解決の疑問点は全実例マッピングを横断して一覧できる
    examples:
      - id: EX-01
        name: 複数の実例マッピングに散らばる疑問点付箋が、1つのページに集まって表示される
      - id: EX-02
        name: 疑問点を持たない実例マッピングは一覧に現れない
      - id: EX-03
        name: livtリポジトリ全体で疑問点が1件もなければ、空状態のメッセージが表示される
    automated: true

  - id: R-02
    name: 各疑問点はどのストーリーのものか分かり、その付箋まで辿れる
    examples:
      - id: EX-01
        name: 疑問点カードは出どころのストーリー名を持つ
      - id: EX-02
        name: 疑問点カードから実例マッピングボードの当該の疑問点付箋へ直接ジャンプできる
    automated: true

  - id: R-03
    name: 一覧はオポチュニティで絞り込める
    examples:
      - id: EX-01
        name: オポチュニティを選ぶと、そのマップに載るストーリーの疑問点だけが表示される
      - id: EX-02
        name: Stories・Example Mappings一覧と同じ絞り込みUIで、同じ軸が使える
      - id: EX-03
        name: 絞り込み状態はURLに反映され、共有したURLで同じ一覧が開く
    automated: true

questions:
  - id: Q-01
    text: 解決した疑問点はどう扱うか（現状はルール化して付箋を消す運用のため、一覧は常に未解決のみを映す）
  - id: Q-02
    text: 同じ集約をMCPにも出すか（実装リポジトリのエージェントが着手前に未解決の疑問点を拾えるようにする）

ubiquitous:
  - livt-repository
  - example-mapping
  - story
  - opportunity
  - discovery
