rules:
  - id: R-01
    name: オポチュニティの現況は、独立したページで映る
    examples:
      - id: EX-01
        name: ダッシュボードの数字は、それぞれ全体に対する割合として1つずつメーターで並ぶ
      - id: EX-02
        name: 自動化の比率が高くても、ディスカバリーが浅ければそう読める
      - id: EX-05
        name: 下の内訳が言っていることを、上のメーターは繰り返さない
      - id: EX-03
        name: オポチュニティのページは現況を持たず、そのページへの入口だけを持つ
      - id: EX-04
        name: ストーリーマップを持たないオポチュニティには、現況のページがない
  - id: R-02
    name: 現況の内訳はストーリー単位で並ぶ
    examples:
      - id: EX-01
        name: オポチュニティのストーリーが、1件につき1行で並ぶ
      - id: EX-02
        name: 行にはストーリー名と、そのマッピングのルールが何件中何件自動化されているかが出る
      - id: EX-03
        name: 実例マッピングのないストーリーの行は、ディスカバリー未着手と分かる
      - id: EX-04
        name: 退役したルールは数えない
  - id: R-03
    name: 現況から既存のページへ辿れる
    examples:
      - id: EX-01
        name: 実例マッピングのあるストーリーの行は、その実例マッピングへ辿る
      - id: EX-02
        name: 実例マッピングのないストーリーの行は、ストーリーのページへ辿る
      - id: EX-03
        name: 未解決の疑問点と提案中のルールは、そのオポチュニティで絞り込んだタスクページへ着地する
      - id: EX-04
        name: ストーリーのゲージは、そのオポチュニティで絞り込んだストーリー一覧へ着地する
      - id: EX-05
        name: 現況のページからオポチュニティのページへ戻れる
  - id: R-04
    name: オポチュニティ一覧のタイルは、開かずに進み具合が分かる
    examples:
      - id: EX-01
        name: タイルに、実例マッピング済みのストーリー数と自動化済みのルール数が出る

questions:
  - id: Q-01
    text: どのストーリーマップにも載っていない実例マッピングをどこに映すか（オポチュニティのページには定義上載らない）
  - id: Q-02
    text: ストーリーの分母をマップ上のカード数とストーリーファイル数のどちらで数えるか（前者はそのオポチュニティが取り上げた範囲、後者はlivtリポジトリ全体で、両者はズレる）
  - id: Q-03
    text: いつ合意され、いつ自動化されたかという時間軸を映すか（livtはいまYAMLだけを読み、gitに依存していない。映すならビルドがgitリポジトリを要求する）

ubiquitous:
  - opportunity
  - story
  - example-mapping
  - story-map
  - discovery
