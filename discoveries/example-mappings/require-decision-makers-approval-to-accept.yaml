rules:
  - id: R-01
    name: decision_makersのあるルールを合意済みにする変更には、その全員の承認が要る
    examples:
      - id: EX-01
        name: 提案中のルールを合意済みに変えるPRは、合意が要る人の全員が承認するまでチェックが通らない
      - id: EX-02
        name: 最初から合意済みで載せるルールも、同じ扱いになる
      - id: EX-03
        name: 提案中のまま載せる変更は、承認を待たずに通る
      - id: EX-04
        name: decision_makersのないルールには、何も求めない
      - id: EX-05
        name: 対象のないPRには「対象なし」として通る結果を付ける
  - id: R-02
    name: 合意が要る人は、作者としても承認者としても満たせる
    examples:
      - id: EX-01
        name: PRの作者がdecision_makersにいれば、書いたことをもって満たされる
      - id: EX-02
        name: 作者でない人は、承認で満たす
      - id: EX-03
        name: チームを書いた場合は、そのメンバーの誰か1人の承認で満たされる
      - id: EX-04
        name: AIやbotのアカウントが開いたPRでは人は作者にならず、本人の承認で満たす
      - id: EX-05
        name: forgeが必須の承認に数えない人の承認も数える
  - id: R-03
    name: チェックは、PRのいまの状態だけを見る
    examples:
      - id: EX-01
        name: 何度走らせても、同じ状態なら同じ結果になる
      - id: EX-02
        name: 承認が付いた順にも、コミットが積まれた順にも左右されない
      - id: EX-03
        name: 確かめるのは合意済みになる入口だけで、mainにすでにある合意済みのルールをあとから確かめ直さない
      - id: EX-04
        name: PRの変更、承認、承認の取り消しのどれが起きても、同じ判定をやり直す
  - id: R-04
    name: 承認の揃った提案は、同じコマンドで合意済みに書き換えられる
    examples:
      - id: EX-01
        name: 書き換えを有効にしたときだけ、提案中のままで全員の承認が揃ったルールを合意済みにする
      - id: EX-02
        name: 書き換えたあとの状態は、同じコマンドのチェックを通る
      - id: EX-03
        name: 書き換えるのは提案のPRのブランチの上だけで、mainに入ったあとは人が合意済みにするPRを出す
      - id: EX-04
        name: 書き換えを使わなくても、人が自分で合意済みに書き換えれば、同じチェックを通る
  - id: R-05
    name: forgeに触れるのはactionだけで、判定と書き換えはlivtのCLIがgitとファイルだけで行う
    examples:
      - id: EX-01
        name: actionはforgeから承認の事実（誰が承認したか、PRの作者は誰か）を読み、CLIに渡す
      - id: EX-02
        name: 判定にAIを使わない（PRの文面に承認済みと書かれていても、承認の記録だけを見る）
      - id: EX-03
        name: 別のforgeは、同じ形の事実を出す部分だけを書けば、同じCLIを使える

questions:
  - id: Q-01
    text: 提案を却下する変更にも、合意が要る人の承認を求めるか
  - id: Q-02
    text: 合意のあとでルールの文言が変わったとき、合意を取り直すか（いまは、意味が変わったルールが新しいIDを取ることに任せている）
  - id: Q-03
    text: 機械が人のブランチに積めないときの扱い（作者がforce pushして書き換えのコミットが消えた場合、forkからのPRの場合）
  - id: Q-04
    text: 機械のコミットがforgeの必須の承認を外すリポジトリで、どう通すか
  - id: Q-05
    text: チームのメンバーを照合する権限を、actionにどう渡すか

ubiquitous:
  - example-mapping
  - story
  - livt-repository
