rules:
  - id: R-01
    name: アクティビティとステップを俯瞰できる
    examples:
      - id: EX-01
        name: アクティビティが横並びで、その下にステップが並ぶ
    issues:
      - https://github.com/boykush/livt/issues/63
    automated: true
  - id: R-02
    name: コミット済みストーリーは詳細ページにリンクする
    examples:
      - id: EX-01
        name: ストーリーファイルがあるカードは矢印付きのリンクになる
      - id: EX-02
        name: キーのないストーリー候補はプレーンなカードで表示される
    automated: true
  - id: R-03
    name: リリーススライスでストーリー行が区切られる
    examples:
      - id: EX-01
        name: リリース未指定のストーリーは未スコープ行にまとまる
    automated: true

questions:
  - id: Q-01
    text: ストーリーマップが複数ある場合の一覧導線をどうするか

ubiquitous:
  - story-map
  - story
  - release-slice
