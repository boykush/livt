rules:
  - id: R-01
    name: アクティビティとユーザータスクを俯瞰できる
    examples:
      - id: EX-01
        name: アクティビティが横並びで、その下にユーザータスクが並ぶ
    issues:
      - https://github.com/boykush/livt/issues/63
  - id: R-02
    name: ストーリーファイルを持つストーリーは詳細ページにリンクする
    examples:
      - id: EX-01
        name: ストーリーファイルがあるカードは矢印付きのリンクになる
      - id: EX-02
        name: キーのないストーリー候補はプレーンなカードで表示される
  - id: R-03
    name: リリーススライスでストーリー行が区切られる
    examples:
      - id: EX-01
        name: リリース未指定のストーリーは未スコープ行にまとまる
  - id: R-04
    name: ストーリーカードのリンクを容易に取得できる
    examples:
      - id: EX-01
        name: キーのあるストーリーカードに🔗のコピーリンクが付き、ワンクリックでUSMページ上のそのカードへのディープリンクがクリップボードに入る
      - id: EX-02
        name: ディープリンクを開くと、マップ上の該当カードの位置に移動する
      - id: EX-03
        name: キーのないストーリー候補にはコピーリンクが付かない
    issues:
      - https://github.com/boykush/livt/issues/69
  - id: R-05
    name: ストーリーマップの一覧から各マップへ辿れる
    status: retired
    examples:
      - id: EX-01
        name: 一覧ページに全ストーリーマップがプレビュー付きのタイルで並び、各マップのボードへリンクする
        retired: true
      - id: EX-02
        name: ボードのヘッダーから一覧ページへ戻れる
        retired: true
  - id: R-06
    name: ストーリーの詳細ページから、ストーリーマップ上のそのカードへ辿れる
    examples:
      - id: EX-01
        name: 詳細ページのストーリーマップへのリンクを開くと、マップ上のそのストーリーのカードの位置に移動し、カードが強調される
      - id: EX-02
        name: 複数のマップに載るストーリーは、マップごとにリンクを持ち、マップ名で見分けられる
      - id: EX-03
        name: どのマップにも載らないストーリーには、ストーリーマップへのリンクがない

questions: []

ubiquitous:
  - story-map
  - story
  - release-slice
