rules:
  - id: R-01
    name: ビルドはレポートを入力として読み、ネットワークに出ない
    examples:
      - id: EX-01
        name: livt build --reports <dir> が渡されたディレクトリのレポートを読む
        retired: true
        superseded_by:
          - livt://mapping/derive-automation-status/rule/R-01/example/EX-04
      - id: EX-02
        name: レポートが1つも無ければ、自動化の状況はどこにも出ない
      - id: EX-03
        name: forgeにもトラッカーにも問い合わせず、渡されたものだけから導く
      - id: EX-04
        name: livtリポジトリにコミットされたレポートを読むので、既定では何も渡さなくてよい
  - id: R-02
    name: ルールと具体例は、それぞれ自分の引用で状況が決まる
    examples:
      - id: EX-01
        name: ルール軸の母数はルール数、具体例軸の母数は具体例数で、別々に数える
      - id: EX-02
        name: 退役した項目はどちらの母数にも数えない
      - id: EX-03
        name: オポチュニティの現況はルール軸だけを追う
      - id: EX-04
        name: 具体例が全て自動化されていても、ルール自身の状況は変わらない
  - id: R-03
    name: 状況は引用の有無で決まり、レポートがあること自体が「見た」という宣言になる
    examples:
      - id: EX-01
        name: レポートに引用があれば自動化済み
      - id: EX-02
        name: レポートはあるが引用が無ければ未自動化
      - id: EX-03
        name: その実装リポジトリのレポートが無ければ対象外で、未自動化とは区別する
        retired: true
        superseded_by:
          - livt://mapping/derive-automation-status/rule/R-03/example/EX-05
      - id: EX-05
        name: 来るはずだったレポートという概念を持たない（宣言が無いので、届かなかった相手を名指せない）
      - id: EX-04
        name: 走査する実装リポジトリは走行ごとに変わってよく、母数もそれに従って動く
  - id: R-04
    name: どの実装リポジトリで自動化されたかが分かる
    examples:
      - id: EX-01
        name: レポートが名乗る実装リポジトリが、そのまま自動化された場所になる
      - id: EX-02
        name: ルールごとに自動化される実装リポジトリは違ってよい
      - id: EX-03
        name: 1つのルールが複数の実装リポジトリで自動化されることもある
  - id: R-05
    name: ruleのautomatedは、誰も書かなくなった後も、投影が単独でボードを支えられるまで読まれてから退役する
    examples:
      - id: EX-01
        name: フラグと投影を並走させない（同じ事実の記録が2つあると、どちらも真実を名乗れなくなる）
        retired: true
        superseded_by:
          - livt://mapping/derive-automation-status/rule/R-05/example/EX-04
      - id: EX-02
        name: 投影が動いてからフラグを落とし、その間のmainはどの時点でも整合する
      - id: EX-03
        name: YAMLスキーマとMCPペイロードの破壊的変更として、メジャーバージョンで切る
      - id: EX-04
        name: フラグは読まれるだけで誰も書かないので、投影と競う2つ目の記録にはならない
      - id: EX-05
        name: 読まれる期間はリリースをまたぎ、次のマイナーがスキーマごと消す
        retired: true
        superseded_by:
          - livt://mapping/derive-automation-status/rule/R-05/example/EX-07
      - id: EX-06
        name: 読み続けるのは移行が重いからで、フラグが正しいからではない（引用の無いフラグは古いままボードに残る）
      - id: EX-07
        name: 読まれる期間はリリース数で区切らない（投影に穴が残るうちに落とすと、フォールバックだけが消えて代わりが立たない）
  - id: R-06
    name: 走査と投影のテストは、ドッグフーディングでは現れない形を含む
    examples:
      - id: EX-01
        name: 複数の実装リポジトリのレポートを合わせて読む
      - id: EX-02
        name: 一部の実装リポジトリにだけ引用がある
      - id: EX-03
        name: 対象のレポートが欠けている
      - id: EX-04
        name: livtリポジトリ自身が唯一の実装リポジトリなので、これらは本番のサイトには現れない
  - id: R-07
    name: 退役したルールを引用しているテストは、埋めるべきものとしてボードに現れる
    status: retired
    examples:
      - id: EX-01
        name: 退役したルールを引用しているテストがあると、Tasksページにその旨が並ぶ
        retired: true
      - id: EX-02
        name: 誤りとしては扱わない（退役は仕様側の決定で、テストはいまも動いて通っている）
        retired: true
      - id: EX-03
        name: 本文が変わったルールへの引用も同じ扱いになるが、見分ける手立てはまだ無い（Q-03）
        retired: true
  - id: R-08
    name: 引用が古い意味を検証し続けないのは、意味が変わったルールが別のIDを取るから
    examples:
      - id: EX-01
        name: 言い回しだけの変更ではIDが変わらず、引用はそのまま有効（結び目はlivt URIで、テストケース名を本文に追従させる必要はない）
      - id: EX-02
        name: 意味が変わったルールは退役し、後継が新しいIDを取る（具体例を書き換えずに差し替えるのと同じ作法）
      - id: EX-03
        name: 旧IDへの引用は退役したルールを指すので、ルール軸の母数から外れる
      - id: EX-04
        name: 後継は引用を持たないので、未自動化のルールとしてTasksページに並ぶ
      - id: EX-05
        name: livtは意味が変わったかを判定しない（判断は書き手のもので、機械が代行すれば定式化のたびにボードが嘘をつく）

questions:
  - id: Q-01
    text: ルール付箋・具体例付箋の見せ方をどう作り直すか（✓スタンプ1個では、ルール軸と具体例軸・3つの状況・テストへのリンクを運べない）
    retired: true
    superseded_by:
      - livt://mapping/show-automation-status-per-rule/rule/R-01
  - id: Q-02
    text: 母数が走行ごとに動くことをサイトがどう示すか（何リポジトリ中いくつを走査したかを明示しないと、前回との比較が黙って壊れる）
    retired: true
    superseded_by:
      - livt://mapping/derive-automation-status/rule/R-02
  - id: Q-03
    text: ルールの本文が変わったとき、古い意味を検証している引用をどう扱うか（引用はlivt URIなので書き換えを素通りし、ボードは自動化済みと言い続ける。フラグの頃はchange-ruleが同じコミットで外させていたが、外す先が無くなった）
    retired: true
    superseded_by:
      - livt://mapping/derive-automation-status/rule/R-08

ubiquitous:
  - livt-uri
  - livt-repository
  - implementation-repository
  - example-mapping
  - story
  - opportunity
  - automation
