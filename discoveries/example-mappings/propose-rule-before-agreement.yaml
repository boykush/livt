rules:
  - id: R-01
    name: ルールはstatusとして提案中（proposed）か合意済み（accepted）かを持てる
    examples:
      - id: EX-01
        name: "status: proposed のルールは提案中として読まれる"
      - id: EX-02
        name: statusのないルールは合意済みとして読まれ、既存の実例マッピングはそのまま読める
      - id: EX-03
        name: proposed・accepted以外の値はビルドを失敗させる（打ち間違いが黙って合意済みに化けない）
    automated: true
  - id: R-02
    name: 提案中のルールは、ボード上で合意済みのルールと一目で見分けられる
    examples:
      - id: EX-01
        name: 提案中のルール付箋は、合意済みのものより淡く描かれる
      - id: EX-02
        name: 色だけに頼らず、付箋に「提案中」のスタンプが付く
      - id: EX-03
        name: 提案中のルールの具体例も、ルールと一緒に淡く描かれる
      - id: EX-04
        name: 凡例が見分け方を説明する
    automated: true
  - id: R-03
    name: 提案中のルールは、テストではなく合意で閉じる仕事としてTasksページに並ぶ
    status: proposed
    examples:
      - id: EX-01
        name: 提案中のルールは「提案中のルール」に並び、「未自動化のルール」には現れない
      - id: EX-02
        name: 先にテストが書かれていても、合意されるまでは提案中のルールに並ぶ
      - id: EX-03
        name: 提案中のルールだけが残っているとき、未自動化の一覧は「合意済みのルールはすべて自動化されています」と言う
    automated: true
  - id: R-04
    name: MCPとCLIは、どのルールにもstatusを付けて返す
    status: proposed
    examples:
      - id: EX-01
        name: statusのないルールもacceptedとして返り、消費側は既定値を知らなくてよい
      - id: EX-02
        name: 実装リポジトリのエージェントは、提案中のルールを自動化の対象から外せる
    automated: true
  - id: R-05
    name: 提案はADRと同じ流れで閉じる — 合意されればaccepted、却下されればretired
    status: proposed
    examples:
      - id: EX-01
        name: 提案を採用するPRは、statusの1行だけを変える
      - id: EX-02
        name: 却下された提案は削除せずretiredにし、statusはproposedのまま残す（合意に至らなかった提案として読める）
      - id: EX-03
        name: 提案中のルールには自動化Issueを起票しない
      - id: EX-04
        name: 提案が答えようとしている疑問点は、提案が合意されたPRで退役させる

questions:
  - id: Q-01
    text: 合意済みのルールをADRのようにイミュータブルに扱うか（現状はchange-ruleがルール本文の書き換えを許しており、変更を退役＋新ルールで表してはいない）

ubiquitous:
  - example-mapping
  - story
  - livt-repository
  - discovery
