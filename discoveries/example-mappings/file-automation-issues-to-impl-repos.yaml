rules:
  - id: R-01
    name: ルールメンテナーはマスタのルールを指定して、対象実装リポジトリへ自動化Issueを起票できる
    examples:
      - id: EX-01
        name: story-keyとrule-idを指定すると、そのルール1件分のIssueが起票される
      - id: EX-02
        name: story-keyのみ指定すると、そのストーリーの未起票ルール全件が起票される
  - id: R-02
    name: 起票したIssueのURLは、スキルがマッピングYAMLのruleに書き戻す
    examples:
      - id: EX-01
        name: 起票に成功すると、該当ruleのissuesにそのURLが追記される
      - id: EX-02
        name: 書き戻しがそのままマスタへの記録（record-rule-automation）になり、手作業を要しない
  - id: R-03
    name: dedupeはマスタ側の記録で判定し、同じルール×対象リポジトリを二重起票しない
    examples:
      - id: EX-01
        name: ruleのissuesに対象リポジトリのIssueが既にあればスキップする
      - id: EX-02
        name: 別の実装リポジトリへの起票は、既存の紐づけがあっても妨げない
  - id: R-04
    name: Issue本文はルール・実例の本文とマスタへのバックポインタを運ぶ
    examples:
      - id: EX-01
        name: 本文にルール名と実例の一覧を含む
      - id: EX-02
        name: バックポインタとしてstory-key・rule-idと、リビングドキュメントのルールアンカー（#rule-{ID}）へのリンクを含む
      - id: EX-03
        name: 起票時点のマスタのrevをspec_versionとして記す
      - id: EX-04
        name: バックポインタが指すルールIDは起票後も不変で、清書・更新のAIスキル共通ポリシーとして担保する
  - id: R-05
    name: ストーリーにUS Issueが紐づいていれば、ルールIssueはそのsub-issueとして起票する
    examples:
      - id: EX-01
        name: US Issueがあるストーリーのルールは、起票時にsub-issueとして親へ紐づく
      - id: EX-02
        name: US Issueがなくてもルール単位の起票は成立する
  - id: R-06
    name: livtは実装リポジトリのコードを読まず、Issueというポインタだけを送る
    examples:
      - id: EX-01
        name: 起票は対象リポジトリのチェックアウトを必要としない
  - id: R-07
    name: 本ストーリーはAIスキルとして提供し、livtのCLIコマンドやMCPツールは追加しない
    examples:
      - id: EX-01
        name: スキルはマスタを読み、gh CLI（既存の認証）で対象リポジトリへ起票する
      - id: EX-02
        name: 書き戻しはワーキングツリーの編集までとし、コミットやPRは通常のレビューフローに委ねる

questions:
  - id: Q-01
    text: 対象実装リポジトリはどこで宣言するか（livtの設定ファイル・ストーリーのメタ・スキル実行時の指定のどれか）

ubiquitous:
  - example-mapping
  - story
  - discovery
