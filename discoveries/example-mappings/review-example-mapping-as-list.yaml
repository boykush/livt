rules:
  - id: R-01
    name: 実例マッピングはボードとリストを切り替えて読める
    examples:
      - id: EX-01
        name: 実例マッピングはボードで開き、切り替えるとリストになる
      - id: EX-02
        name: 選んだ表示は、次に開く実例マッピングにも引き継がれる
      - id: EX-03
        name: 一覧ページのプレビューは、閲覧者がどちらを選んでいてもボードで映る
  - id: R-02
    name: リストではルールが1つにつき1行で並ぶ
    examples:
      - id: EX-01
        name: 行にはルールのID・名前・自動化済みの印・自動化Issueへのリンクが載る
      - id: EX-02
        name: 行には、その下に折りたたまれている具体例の件数が出る
      - id: EX-03
        name: 疑問点はルールの後にまとまり、1つにつき1行で並ぶ
      - id: EX-04
        name: リストの行はタスクページと同じカードで並び、付箋の塗りはボードに残る（色は左端のアクセントとして残す）
  - id: R-03
    name: 具体例はルールの行の下に折りたたまれ、開いたときだけ見える
    examples:
      - id: EX-01
        name: リストに切り替えた直後は、どのルールも折りたたまれている
      - id: EX-02
        name: ルールの行ごとに開閉でき、すべて開く・すべて閉じるもできる
      - id: EX-03
        name: 具体例のないルールの行には開閉がない
  - id: R-04
    name: 付箋へのリンクは、どちらの表示でもその付箋に着地する
    examples:
      - id: EX-01
        name: 折りたたまれた具体例へのリンクは、そのルールを開いてから着地する
      - id: EX-02
        name: リストの行もIDからリンクをコピーでき、コピーされるURLはボードと同じ

questions: []

ubiquitous:
