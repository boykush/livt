rules:
  - id: R-01
    name: ルール付箋は自動化済みかどうかで色分けされる
    examples:
      - id: EX-01
        name: automatedのあるruleは自動化済みの色で描画される
      - id: EX-02
        name: automatedのないruleは未自動化として描画される
      - id: EX-03
        name: 凡例が2値の意味を説明する
  - id: R-02
    name: 色分けはマスタの記録だけから導出され、buildはネットワークに出ない
    examples:
      - id: EX-01
        name: SSGはruleのautomatedとissuesのみを読み、GitHubには問い合わせない
      - id: EX-02
        name: 自動化状況の変化はマッピングYAMLのdiffとして履歴に残る

questions:
