rules:
  - id: R-01
    name: ポリシーは、どのストーリーにも属さない場所に1ファイルずつ置く
    examples:
      - id: EX-01
        name: design/policies/ に置いたポリシーは、どの実例マッピングにも属さない
      - id: EX-02
        name: ポリシーは md で、フロントマターと本文を持つ
  - id: R-02
    name: 用語とポリシーは design/ の下に、種類ごとにまとまる
    examples:
      - id: EX-01
        name: 用語は design/ubiquitous/、ポリシーは design/policies/ に置く
      - id: EX-02
        name: 今の ubiquitous/ の用語は design/ubiquitous/ に移る
  - id: R-03
    name: ポリシーは文脈ディレクトリで切れる
    examples:
      - id: EX-01
        name: design/policies/{ctx}/{key}.md に置いたポリシーは、その文脈のポリシーとして読まれる
      - id: EX-02
        name: design/policies/{key}.md に置いたポリシーは文脈を持たず、すべての文脈に効く
      - id: EX-03
        name: デザインシステムがアプリごとに分かれるとき、文脈ごとにポリシーの範囲を書き分けられる
  - id: R-04
    name: ポリシーは、用語とは別の livt URI で指せる
    examples:
      - id: EX-01
        name: 文脈を持つポリシーは livt://policy/{ctx}/{key} で指せる
      - id: EX-02
        name: 文脈を持たないポリシーは livt://policy/{key} で指せる
      - id: EX-03
        name: 用語は置き場が design/ に移っても livt://ubiquitous/… のまま指せ、既存の参照は壊れない
  - id: R-05
    name: ポリシーは文を name に持ち、入力と出力の用語を参照する
    examples:
      - id: EX-01
        name: デザインシステムの文脈のポリシー「一覧はオポチュニティで絞り込める」は、入力にドメインの用語「オポチュニティ」を参照する
      - id: EX-02
        name: description に1文の要約を任意で持てる
        retired: true
  - id: R-06
    name: ポリシーの状態は、ルールと同じ語彙で持つ
    examples:
      - id: EX-01
        name: 合意前のポリシーは proposed、合意済みは accepted、却下は rejected、退役は retired
      - id: EX-02
        name: status を書かないポリシーは、ルールと同じく accepted として読まれる
  - id: R-07
    name: ポリシーはそれ自体で退役でき、置き換え先は任意
    examples:
      - id: EX-01
        name: 退役したポリシーは消さずに残り、そのキーは他のポリシーに渡さない
      - id: EX-02
        name: 置き換え先があれば superseded_by で指し、なければ書かない

questions:
  - id: Q-01
    text: ポリシーの具体例を md でどう持つか（ID を付けて引用できるようにするか、Do／Don't に分けるか。ポリシーを書いてみてから決める）
  - id: Q-02
    text: 文脈の説明をどこに置くか（livt://mapping/scope-terms-by-context/question/Q-02 と同じ問い）
  - id: Q-03
    text: status を書かないポリシーを accepted として読むか（status のないルールは accepted として読む）
    retired: true
    superseded_by:
      - livt://mapping/define-policies-apart-from-stories/rule/R-06/example/EX-02
  - id: Q-04
    text: ポリシーに来歴（sources）を持たせるか

ubiquitous:
  - policy
  - context
  - ubiquitous-language
  - livt-uri
  - example-mapping
