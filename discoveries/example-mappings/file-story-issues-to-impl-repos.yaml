rules:
  - id: R-01
    name: ストーリーマップメンテナーはストーリーを指定して、対象実装リポジトリへストーリー単位のIssueを起票できる
    examples:
      - id: EX-01
        name: story-keyと対象リポジトリを指定すると、ストーリーの本文を含むIssueが1件起票される
      - id: EX-02
        name: Issueの本文はマスタへのバックポインタ（story-key）と起票時点のspec_versionを運ぶ
  - id: R-02
    name: 起票したIssueのURLは、スキルがストーリーのfrontmatterのissuesに書き戻す
    examples:
      - id: EX-01
        name: 起票に成功すると、frontmatterのissues（URLのリスト）にそのURLが追記される
      - id: EX-02
        name: 書き戻しがそのまま紐づけになり、手作業を要しない
      - id: EX-03
        name: 既存の任意メタissue（単数）はissuesとは別物で、移行せずそのまま残す
  - id: R-03
    name: dedupeはマスタ側の記録で判定し、同じストーリー×対象リポジトリに二重起票しない
    examples:
      - id: EX-01
        name: ストーリーに対象リポジトリのIssueが既に記録されていればスキップする
      - id: EX-02
        name: 別の実装リポジトリへの起票は、既存の紐づけがあっても妨げない
  - id: R-04
    name: ストーリー単位のIssueはルールIssueなしでも成立し、両方あるときだけ親子になる
    examples:
      - id: EX-01
        name: ルールIssueが1件もないストーリーでも、ストーリー単位のIssueは単独で起票できる
      - id: EX-02
        name: 同じストーリー・同じリポジトリにルールIssueがあれば、sub-issueとして束ねられる（起票の順序に依存しない）
      - id: EX-03
        name: 以後のルールIssueは起票時にこのIssueへ紐づく（file-automation-issues-to-impl-repos側のルール）
  - id: R-05
    name: 本ストーリーはAIスキルとして提供し、livtのCLIコマンドやMCPツールは追加しない
    examples:
      - id: EX-01
        name: スキルはマスタを読み、gh CLI（既存の認証）で対象リポジトリへ起票する
      - id: EX-02
        name: 書き戻しはワーキングツリーの編集までとし、コミットやPRは通常のレビューフローに委ねる
      - id: EX-03
        name: ストーリー単位の起票はルールIssue起票とは別スキルとし、USと1:1で対応させる
  - id: R-06
    name: 対象実装リポジトリの宣言はfile-automation-issues-to-impl-reposと共通で、ストーリーのfrontmatterのreposを参照する
    examples:
      - id: EX-01
        name: 同じreposの宣言が、ストーリー単位のIssueとルールIssueの両方の起票先になる

ubiquitous:
  - example-mapping
  - story
  - discovery
