name: ディスカバリーと開発のギャップ
ubiquitous:
  - discovery
  - example-mapping
  - story
activities:
  - key: fill-unautomated-gap
    name: 実装リポジトリでギャップを埋める
    steps:
      - key: file-story-issues
        name: ストーリーごとに親Issueを起票する
        stories:
          - name: ストーリー単位の親Issueを起票してルールIssueを束ねる
      - key: file-rule-issues
        name: ルールごとに自動化Issueを起票する
        stories:
          - name: livt経由で各実装リポジトリに自動化Issueを起票する
            key: file-automation-issues-to-impl-repos
      - key: automate-in-impl-repos
        name: 実装リポジトリ側で自動化する
        stories:
          - name: 実装リポジトリがマスタを見てテスト駆動で自動化する
            key: automate-from-master-in-impl-repos
  - key: reflect-automation-status
    name: 自動化の状況を映す
    steps:
      - key: link-issues-to-rule
        name: Issueをルールに紐づける
        stories:
          - name: 起票したIssueをルールに紐づける
            key: link-issues-to-rule
      - key: show-status-per-rule
        name: ルールごとに自動化の状況を映す
        stories:
          - name: ルールが自動化されているかを色分けで映す
            key: show-automation-status-per-rule
      - key: trace-rule-to-tests
        name: ルールから対応テストを辿る
        stories:
          - name: ルール付箋から対応Issue・テストへ辿る
            key: trace-rule-to-tests
