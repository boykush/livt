name: ディスカバリーと開発のギャップ
ubiquitous:
  - discovery
  - example-mapping
  - story
  - livt-uri
activities:
  - key: fill-unautomated-gap
    name: 実装リポジトリでギャップを埋める
    steps:
      - key: pick-next-gap
        name: 次に埋めるギャップを選ぶ
        stories:
          - name: 未自動化のルールを横断で見渡す
            key: overview-unautomated-rules
      - key: file-story-issues
        name: ストーリーごとにIssueを起票する
        stories:
          - name: livt経由でストーリー単位のIssueを起票する
            key: file-story-issues-to-impl-repos
            release: coordinate-with-issues
      - key: file-rule-issues
        name: ルールごとに自動化Issueを起票する
        stories:
          - name: livt経由で各実装リポジトリに自動化Issueを起票する
            key: file-automation-issues-to-impl-repos
            release: coordinate-with-issues
      - key: automate-in-impl-repos
        name: 実装リポジトリ側で自動化する
        stories:
          - name: 実装リポジトリがマスタを見てテスト駆動で自動化する
            key: automate-from-master-in-impl-repos
            release: read-spec
  - key: reflect-automation-status
    name: 自動化の状況を映す
    steps:
      - key: record-rule-automation
        name: ルールの自動化を記録する
        stories:
          - name: ルールの自動化をマスタに記録する
            key: record-rule-automation
            release: coordinate-with-issues
      - key: show-status-per-rule
        name: ルールごとに自動化の状況を映す
        stories:
          - name: ルールが自動化されているかを一目で映す
            key: show-automation-status-per-rule
            release: reflect-status
      - key: trace-rule-to-tests
        name: ルールから対応テストを辿る
        stories:
          - name: ルール付箋から対応Issue・テストへ辿る
            key: trace-rule-to-tests
            release: reflect-status
      - key: trace-test-to-rule
        name: テストからルールを辿る
        stories:
          - name: テストからルール・実例へ辿る
            key: trace-test-to-rule
            release: reflect-status
      - key: show-status-rollup
        name: ストーリー・リリース単位で自動化の状況を映す
        stories:
          - name: 自動化カバレッジをストーリー・リリースで見渡す
            key: show-automation-coverage-rollup
releases:
  - id: read-spec
    name: 実装リポジトリが仕様を読める
  - id: coordinate-with-issues
    name: Issueで協調できる
  - id: reflect-status
    name: 自動化の状態が映る
