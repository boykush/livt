name: 行き場のないポリシー
ubiquitous:
  - policy
  - example-mapping
  - ubiquitous-language
  - story
  - livt-uri
activities:
  - key: notice-policies
    name: ポリシーに気づく
    steps:
      - key: stop-at-as-existing
        name: 「既存の実装通り」で立ち止まる
      - key: find-in-the-log
        name: ログの中のポリシーを見つける
  - key: define-policies
    name: ポリシーを定義する
    steps:
      - key: write-apart-from-the-log
        name: ログとは別に書く
        stories:
          - name: ポリシーを、ストーリーに属さない場所に定義する
            key: define-policies-apart-from-stories
  - key: follow-from-the-log
    name: ログからポリシーを引く
    steps:
      - key: follow-as-is
        name: そのまま倣う
      - key: refine
        name: 倣ったうえで具体化する
        stories:
          - name: 実例マッピングのルールが、ポリシーを参照する
      - key: deviate
        name: 外れる
  - key: read-in-implementation
    name: 実装でポリシーを引く
    steps:
      - key: read
        name: ポリシーを読む
  - key: expand-to-other-forms
    name: 別の形式に展開する
    steps:
      - key: expand
        name: 展開先を起こす
      - key: cite-back
        name: 展開先から元を辿る
  - key: revise-policies
    name: ポリシーを改め、退役させる
    steps:
      - key: trace-change
        name: 変更をログから辿る
      - key: see-impact
        name: 影響を見る
      - key: retire
        name: 退役させる
      - key: absorb-into-terms
        name: 用語に取り込む
