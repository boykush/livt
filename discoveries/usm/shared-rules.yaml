name: 行き場のない共通ルール
ubiquitous:
  - shared-rule
  - example-mapping
  - ubiquitous-language
  - story
  - livt-uri
activities:
  - key: notice-shared-rules
    name: 共通ルールに気づく
    steps:
      - key: stop-at-as-existing
        name: 「既存の実装通り」で立ち止まる
      - key: find-in-the-log
        name: ログの中の共通ルールを見つける
  - key: define-shared-rules
    name: 共通ルールを定義する
    steps:
      - key: write-apart-from-the-log
        name: ログとは別に書く
      - key: group-by-subject
        name: 主題で束ねる
  - key: follow-from-the-log
    name: ログから共通ルールを引く
    steps:
      - key: follow-as-is
        name: そのまま倣う
      - key: refine
        name: 倣ったうえで具体化する
      - key: deviate
        name: 外れる
  - key: read-in-implementation
    name: 実装で共通ルールを引く
    steps:
      - key: read
        name: 共通ルールを読む
  - key: expand-to-other-forms
    name: 別の形式に展開する
    steps:
      - key: expand
        name: 展開先を起こす
      - key: cite-back
        name: 展開先から元を辿る
  - key: revise-shared-rules
    name: 共通ルールを改め、退役させる
    steps:
      - key: trace-change
        name: 変更をログから辿る
      - key: see-impact
        name: 影響を見る
      - key: retire
        name: 退役させる
      - key: absorb-into-terms
        name: 用語に取り込む
