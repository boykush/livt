name: Collaborative Discovery

activities:
  - key: story-mapping
    name: Discover the whole story
    steps:
      - key: identify-activities
        name: Identify user activities
      - key: break-into-tasks
        name: Break activities into tasks
      - key: discover-stories
        name: Discover stories
      - key: slice-releases
        name: Slice into releases

  - key: refine-whole-story
    name: Refine the whole story
    steps:
      - key: confirm-story-map
        name: Confirm the story map
        stories:
          - key: confirm-story-map
            name: Confirm story map
      - key: review-narrative-flow
        name: Review narrative flow
        stories:
          - key: confirm-refinements-while-editing
            name: Confirm refinements while editing
      - key: align-activity-task-granularity
        name: Align activity and task granularity
      - key: reposition-stories
        name: Reposition stories
      - key: write-out-stories
        name: Write out stories
        stories:
          - key: write-out-stories-from-usm
            name: Write out stories from USM
      - key: review-release-slices
        name: Review release slices
        stories:
          - key: adjust-release-scope
            name: Adjust release scope

  - key: discovery
    name: Discovery
    steps:
      - key: pick-story
        name: Pick a story to explore
      - key: discover-rules
        name: Discover rules
        stories:
          - key: confirm-discovery-outcomes
            name: Confirm discovery outcomes
      - key: illustrate-examples
        name: Illustrate with examples
      - key: capture-questions
        name: Capture questions

releases:
  - name: Walking Skeleton
    stories:
      - confirm-story-map
      - confirm-discovery-outcomes
  - stories:
      - confirm-refinements-while-editing
      - write-out-stories-from-usm
      - adjust-release-scope
