name: 協働ディスカバリー
ubiquitous:
  - story-map
  - example-mapping
  - story
  - discovery
  - transcribe
  - refine
  - planning
  - ubiquitous-language
activities:
  - key: story-mapping
    name: 全体ストーリーを発見する
    steps:
      - key: frame-user-journey
        name: ユーザージャーニーを描く
      - key: identify-story-candidates
        name: ストーリー候補を洗い出す
      - key: shape-release-slices
        name: リリーススライスを切り出す
  - key: refine-whole-story
    name: 全体ストーリーをブラッシュアップする
    steps:
      - key: confirm-story-map
        name: ストーリーマップを確認する
        stories:
          - name: AIエージェントでストーリーマップYAMLを起こす
            key: transcribe-story-map-with-ai-agent
          - name: ブラウザでストーリーマップをプレビューする
            key: preview-story-map-in-browser
      - key: refine-story-map-structure
        name: ストーリーマップの構造をブラッシュアップする
        stories:
          - name: USMエキスパートに相談して清書PRを出す
            key: refine-story-map-with-usm-expert
      - key: prepare-stories-for-detailed-discovery
        name: 詳細ディスカバリーに向けてストーリーを準備する
        stories:
          - name: 詳細ディスカバリー用にストーリー候補をコミットする
            key: commit-story-candidates-for-detailed-discovery
  - key: discovery
    name: ディスカバリー
    steps:
      - key: pick-story
        name: 探索するストーリーを選ぶ
      - key: discover-rules
        name: ルールを発見する
      - key: illustrate-examples
        name: 実例で示す
      - key: capture-questions
        name: 疑問を記録する
  - key: refine-discovery
    name: ディスカバリーをブラッシュアップする
    steps:
      - key: transcribe-collaboration-outcome
        name: 協働結果を転記する
        stories:
          - name: ボードから実例マッピングYAMLを素のまま転記する
            key: transcribe-example-mapping-from-board
          - name: ブラウザで実例マッピングをプレビューする
            key: preview-example-mapping-in-browser
      - key: refine-example-mapping-structure
        name: 実例マッピングの構造をブラッシュアップする
        stories:
          - name: BDDエキスパートに相談して清書PRを出す
            key: refine-example-mapping-with-bdd-expert
      - key: plan-against-implementation-and-design
        name: 実装・デザインと突き合わせて計画する
        stories:
          - name: 実例マッピングを実装・デザインと突き合わせて計画する
          - name: 協働結果の漏れを調査する
  - key: maintain-living-master
    name: マスタを生かし続ける
    steps:
      - key: agree-on-rule-change
        name: ルールの変更・追加に合意する
      - key: reflect-in-master-mapping
        name: 実例マッピングマスタに反映する
        stories:
          - name: ルール単位の細かいPRで実例マッピングを更新する
            key: update-example-mapping-per-rule
