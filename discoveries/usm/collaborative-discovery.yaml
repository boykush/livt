name: 協働ディスカバリー
ubiquitous:
  - story-map
  - example-mapping
  - story
  - discovery
  - bdd/discovery
  - record
  - formulation
  - ubiquitous-language
  - context
  - livt-repository
activities:
  - key: story-mapping
    name: 全体ストーリーを組み立てる
    steps:
      - key: frame-user-journey
        name: ユーザージャーニーを描く
      - key: identify-story-candidates
        name: ストーリー候補を洗い出す
      - key: shape-release-slices
        name: リリーススライスを切り出す
  - key: refine-whole-story
    name: 全体ストーリーをブラッシュアップする
    steps:
      - key: confirm-story-map
        name: ストーリーマップを確認する
        stories:
          - name: AIエージェントでストーリーマップYAMLを起こす
            key: transcribe-story-map-with-ai-agent
          - name: ブラウザでストーリーマップをプレビューする
            key: preview-story-map-in-browser
      - key: refine-story-map-structure
        name: ストーリーマップの構造をブラッシュアップする
        stories:
          - name: USMエキスパートに相談して構造を整えるコミットを重ねる
            key: refine-story-map-with-usm-expert
      - key: prepare-stories-for-detailed-discovery
        name: 詳細ディスカバリーに向けてストーリーを準備する
        stories:
          - name: 詳細ディスカバリー用にストーリー候補のカードを書く
            key: commit-story-candidates-for-detailed-discovery
  - key: discovery
    name: 発見
    steps:
      - key: pick-story
        name: 探索するストーリーを選ぶ
        stories:
          - name: 一覧をオポチュニティで絞り込む
            key: filter-lists-by-opportunity
          - name: サイト内をテキストで検索する
            key: search-site-by-text
      - key: discover-rules
        name: ルールを発見する
      - key: illustrate-examples
        name: 具体例で示す
      - key: capture-questions
        name: 決めきれないものを疑問点に残す
      - key: align-language
        name: 言葉を揃える
        stories:
          - name: ユビキタス言語を用語集で引く
            key: look-up-terms-in-glossary
          - name: 用語を文脈で切り分ける
            key: scope-terms-by-context
  - key: record-and-formulate
    name: 発見の成果を記録して定式化する
    steps:
      - key: transcribe-collaboration-outcome
        name: 協働結果を記録する
        stories:
          - name: ボードから実例マッピングYAMLを素のまま記録する
            key: transcribe-example-mapping-from-board
          - name: ブラウザで実例マッピングをプレビューする
            key: preview-example-mapping-in-browser
      - key: formulate-example-mapping
        name: 実例マッピングを定式化する
        stories:
          - name: BDDエキスパートに相談して定式化のコミットを重ねる
            key: refine-example-mapping-with-bdd-expert
          - name: 協働結果の漏れを調査する
  - key: maintain-living-master
    name: livtリポジトリを生かし続ける
    steps:
      - key: agree-on-rule-change
        name: ルールの変更・追加に合意する
        stories:
          - name: 合意前のルールを提案中として実例マッピングに載せる
            key: propose-rule-before-agreement
      - key: reflect-in-master-mapping
        name: livtリポジトリの実例マッピングに反映する
        stories:
          - name: ルール単位の細かいコミットで実例マッピングを更新する
            key: update-example-mapping-per-rule
      - key: follow-up-open-questions
        name: 未解決の疑問点を追う
        stories:
          - name: 未解決の疑問点を横断で見渡す
            key: overview-open-questions
