name: 律速する意思決定
ubiquitous:
  - discovery
  - bdd/discovery
  - example-mapping
  - story
  - formulation
  - livt-repository
activities:
  - key: prepare-the-session
    name: セッションを仕込む
    steps:
      - key: pick-what-to-decide
        name: 何を決めるかを絞る
      - key: hand-the-context-over
        name: AIに文脈を渡す
  - key: decide-with-ai-in-the-room
    name: AIを招いて発見する
    steps:
      - key: surface-examples-live
        name: その場で具体例を出す
      - key: press-for-gaps
        name: 抜けを突く
      - key: settle-rules
        name: 確度が高いルールは決めきる
      - key: propose-rules-for-agreement
        name: 人間同士の合意が要るルールは提案中として置く
      - key: leave-questions-open
        name: 決めきれないものを疑問点に残す
  - key: close-within-the-session
    name: セッション中に閉じる
    steps:
      - key: formulate-in-session
        name: その場で定式化する
      - key: check-it-in-the-room
        name: その場で開いて確かめる
