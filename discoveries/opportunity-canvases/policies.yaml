canvas:
  solution-ideas:
    - ポリシーを、ストーリーに属さない定義として実例マッピングとは別に置く
    - 実例マッピングはポリシーに、そのまま倣う・倣ったうえで具体化する・外れるの3通りで関わり、どれもログに残す
    - ポリシーは自動化では閉じず、概念としてユビキタス言語の用語に取り込まれたら、その用語に置き換わって退役する
    - ポリシーを元にADR・デザインシステム・AIエージェントのルールへ展開し、展開先は元のポリシーをlivt URIで引用する
  problems:
    - 実例マッピングは1つのストーリーに属し、ストーリーをまたいで効く決定を置く場所がない
    - 既存機能のパターンに倣うルールが「既存の実装通り」の1ルールに潰れ、倣う中身が書かれない
    - 途中からlivtを使うと、前例はコードにしかなく、livtに書き起こされているとは限らない
    - 常に効く決まりが、規約文書やAIエージェント向けの指示のような散文にしか置けない
  users-and-customers:
    - 既存機能に倣って新しい機能のルールを決めるスリーアミーゴス
    - プロダクトの途中からlivtを使い始めたチーム
    - 実装リポジトリで動くAIエージェント
  solutions-today:
    - 同じルールを、関係するフィーチャーや実例マッピングごとに書き写す
    - ストーリーをまたぐ決まりは、規約文書やAIエージェント向けの指示に散文で置く。どの決定がそれに倣い、どこで外れたかは残らない
    - フィーチャーは能力ごとにまとまり、能力をまたぐルールは置き場がない
  user-value:
    - 新しい機能を決めるとき、前例をポリシーとして書き起こし、実例マッピングから倣う

ubiquitous:
  - example-mapping
  - ubiquitous-language
  - story
  - livt-uri
