canvas:
  solution-ideas:
    - 協働セッションにAIを招く
    - AIが絡むフェーズを前倒しする
    - MTGを繋ぎながら、それぞれがAIセッションと実例マッピングをして即座にレビュー依頼し合う
    - 観点をコンテキストに含める。含められるなら手段は問わない
    - 1人がAIセッションと実例マッピングをして、人間間でレビューして合意する
  problems:
    - AI開発で仕様の意思決定がボトルネックになっていく
    - AIを活用しない限りスピードが上がらない
  solutions-today:
    - 同期MTGでMiro等を使って実例マッピングを協働する
    - 人間のみで協働セッションをして、AIで記録するのはそのあと
  user-value:
    - AIなしでMiro等で意思決定するより早く決められる

ubiquitous:
  - discovery
  - example-mapping
  - record
