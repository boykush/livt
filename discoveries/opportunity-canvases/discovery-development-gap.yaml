canvas:
  solution-ideas:
    - 仕様の一点をlivt URIで名指しし、テスト・Issue・コミットから引けるようにする
    - 実装リポジトリのエージェントがMCP経由で仕様を読む
    - 自動化済みかは各実装リポジトリのテストから導き、livtは決定だけを持つ
    - Gherkinの解釈は、ステップ定義に代えてAIが担う
    - テストはどの層・どのリポジトリに書いてもよく、引用を機械的に集めて追える
  problems:
    - 合意した仕様がディスカバリー側に留まり、実装側から読まれない
    - テストを見てもどのルールを満たしているのか分からない
    - ルールごとに自動化される実装リポジトリが違うのに、記録はどこで自動化されたかを言わない
    - 定式化したGherkinを、実装のどの層で自動化するかが決まらない
    - テストピラミッドに従うと、BDDの自動化をすべてE2E（Largeテスト）に起こすのは現実的でない
  users-and-customers:
    - 実装リポジトリの開発者
    - 実装リポジトリで動くAIエージェント
    - オポチュニティ推進者
    - バックエンドとフロントエンドの2リポジトリに分かれて開発するチーム
  solutions-today:
    - 仕様を都度Slackで訊く
    - チケットに仕様を書き写し、そこから先は同期しない
    - コードコメントにルール番号だけ書くが、番号は他のマッピングにも存在する
    - 自動化済みかは人がフラグを立てて示し、確認はAIが実装のコードを読んで行う
    - Cucumberのステップ定義でGherkinを解釈し、テストとして実行する
  business-challenges:
    - 仕様と実装の乖離が、時間とともに静かに広がる
    - 何が未実装かを人手で数え直し、その手間はリポジトリの数だけ増える
  user-value:
    - テストコメントのlivt URIから、ルールと具体例へ戻る
    - ルール単位でIssueを起票し、実装リポジトリで自動化する
    - どのルールがどの実装リポジトリで未着手かを見て、次に埋めるギャップを選ぶ
  user-metrics:
    - livt URIを引用しているテスト・Issueの数
    - ルール×実装リポジトリ単位の未自動化件数の推移
    - livtの記録と実装の実態が食い違っている件数
  adoption-strategy:
    - 実装リポジトリ向けのMCPプラグインとして配る
    - 起票スキルが、backpointerを最初から本文に埋める
    - 実装リポジトリはsubmodule等でlivtリポジトリ側に引き寄せる
  business-impact:
    - 仕様の取り違えに由来する手戻り件数
    - 合意から全実装リポジトリに反映されるまでのリードタイム
  budget:
    - OSSとして個人の余暇で開発、外部コストは持たない

ubiquitous:
  - discovery
  - example-mapping
  - livt-uri
  - livt-repository
  - implementation-repository
