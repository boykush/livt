[settings]
experimental = true

[tools]
go = "1.26.5"
node = "24.20.0"
hk = "latest"
pkl = "latest"
golangci-lint = "2.13.2"
goreleaser = "2.18.2"
"aqua:rust-lang/mdBook" = "0.5.4"
"cargo:mdbook-i18n-helpers" = "0.4.0"
"conda:gettext-tools" = "0.25.1"

# Check commands shared by CI (.github/workflows/ci.yml) and the hk pre-commit
# hooks (hk.pkl) — one definition, no drift. Run them all with `mise run check`.
[tasks.fmt]
description = "Check gofmt formatting"
# Scope to tracked files so nested local worktrees (.claude/worktrees) don't
# leak into the check; `.` would recurse into them.
run = '''
files=$(gofmt -s -l $(git ls-files '*.go'))
if [ -n "$files" ]; then
  echo "Needs formatting (run: gofmt -s -w .):"
  echo "$files"
  exit 1
fi
'''

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.tidy]
description = "Check go.mod/go.sum are tidy (run: go mod tidy)"
run = "go mod tidy -diff"

[tasks.build]
description = "Build all packages"
run = "go build ./..."

[tasks.test]
description = "Run tests with the race detector"
run = "go test -race ./..."

[tasks.check]
description = "Run all CI checks"
depends = ["fmt", "vet", "lint", "tidy", "build", "test", "docs:check"]

# The docs are written in English under docs/src. Each translation is a gettext
# catalog, docs/po/{lang}.po, keyed by the English passages it translates.
[tasks."docs:build"]
description = "Build the docs: English into docs/book, Japanese into docs/book/ja"
# English first: its build empties docs/book, the Japanese book included.
run = [
  "mdbook build docs",
  "MDBOOK_BOOK__LANGUAGE=ja mdbook build docs -d docs/book/ja",
]

[tasks."docs:pot"]
description = "Extract the English docs' passages into docs/po/messages.pot"
# Sources without line numbers, so moving an English line leaves ja.po alone.
env = { MDBOOK_OUTPUT = '{"xgettext": {"granularity": 0}}' }
run = "mdbook build docs -d docs/po"

[tasks."docs:po"]
description = "Merge the English docs' current passages into docs/po/ja.po"
depends = ["docs:pot"]
# The template's creation date is dropped, so a merge that changes nothing
# leaves ja.po untouched.
run = '''
grep -v '^"POT-Creation-Date:' docs/po/messages.pot |
  msgmerge --quiet --previous --no-wrap --update --backup=none docs/po/ja.po -
msgattrib --no-obsolete --no-wrap -o docs/po/ja.po docs/po/ja.po
'''

[tasks."docs:check"]
description = "Check docs/po/ja.po translates every passage the English docs have"
depends = ["docs:pot"]
run = '''
if ! msgcmp docs/po/ja.po docs/po/messages.pot ||
   ! msgcmp --use-untranslated docs/po/messages.pot docs/po/ja.po; then
  echo "Out of date (run: mise run docs:po, then translate what it leaves empty or fuzzy)"
  exit 1
fi
'''

[tasks.snapshot]
description = "Dry-run the goreleaser release build locally (no publish)"
run = "goreleaser release --snapshot --clean"

[hooks]
postinstall = "hk install"

[env]
