# Reviews the owner's pull requests against the architectural decisions in boykush/adr,
# and approves the ones that pass as the Claude GitHub App. That approval is the one the
# default branch's ruleset asks for. The reusable workflow lives in boykush/workflows,
# whose README lists what adopting it takes.
name: ai-review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  ai-review:
    uses: boykush/workflows/.github/workflows/ai-review.yml@9f8a0fd61c22e57fc95006ec126643f2283c8fec
    permissions:
      contents: read
      pull-requests: read
      id-token: write
