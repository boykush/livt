name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "stories/**"
      - "discoveries/**"
      - "ubiquitous/**"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2.0.0
        with:
          mdbook-version: latest

      # mdBook docs -> site root (https://boykush.github.io/livt/)
      - name: Build docs
        run: mdbook build docs

      # livt build -> /demo subpath (https://boykush.github.io/livt/demo/)
      - name: Build livt site
        run: go run . build -o dist

      - name: Assemble site
        run: |
          mkdir -p _site/demo
          cp -r docs/book/. _site/
          cp -r dist/. _site/demo/

      # v4.0.0+ pins its internal actions/upload-artifact to a SHA, satisfying
      # the repo's "pin actions to a full-length SHA" policy (v3 did not).
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
