name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "stories/**"
      - "discoveries/**"
      - "ubiquitous/**"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      # Surface whichever attempt (see retries below) actually deployed.
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry1.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2
        with:
          mdbook-version: latest

      # mdBook docs -> site root (https://boykush.github.io/livt/)
      - name: Build docs
        run: mdbook build docs

      # livt build -> /demo subpath (https://boykush.github.io/livt/demo/)
      - name: Build livt site
        run: go run . build -o dist

      - name: Assemble site
        run: |
          mkdir -p _site/demo
          cp -r docs/book/. _site/
          cp -r dist/. _site/demo/

      # v4.0.0+ pins its internal actions/upload-artifact to a SHA, satisfying
      # the repo's "pin actions to a full-length SHA" policy (v3 did not).
      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

      # GitHub Pages' backend intermittently fails deployments with a generic
      # "Deployment failed, try again later." — roughly a third of runs, even
      # when the build and artifact are healthy. The action treats that status
      # as terminal (no built-in retry), so we retry it ourselves: each attempt
      # creates a fresh Pages deployment, with a short pause to let the backend
      # settle. Observed empirically to need up to three attempts to go green.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        continue-on-error: true

      - name: Settle before retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        continue-on-error: true

      - name: Settle before retry 2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (retry 2)
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
