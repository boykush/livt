name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "stories/**"
      - "discoveries/**"
      - "ubiquitous/**"
      # The collect station's output. A merged report changes nothing else, so
      # without this the board goes on showing the automation status it had
      # until some unrelated push happens to rebuild it.
      - "automations/**"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

# Least privilege by default; each job grants only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # livt build -> /demo subpath (https://boykush.github.io/livt/demo/)
      # Built rather than `go run`: the version the site's build page names is
      # stamped from the tag or commit, and `go run` leaves it "(devel)".
      - name: Build livt site
        run: |
          go build -o "$RUNNER_TEMP/livt" .
          "$RUNNER_TEMP/livt" build -o dist

      # docs/site is committed HTML, published as it is: the site root
      # (https://boykush.github.io/livt/), Japanese beneath it at /ja/.
      - name: Assemble site
        run: |
          mkdir -p _site/demo
          cp -r docs/site/. _site/
          cp -r dist/. _site/demo/

      - name: Upload the site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: _site
          if-no-files-found: error
          overwrite: true # re-running every job uploads it again
          retention-days: 1

  # Pages serves gh-pages, where the site shares the branch with the pull
  # requests' previews. Pushed from a job of its own, so the token that can
  # write never runs the build: `go run` executes every module it depends on.
  publish:
    needs: build
    permissions:
      contents: write # push to gh-pages
    uses: $/.github/workflows/publish-pages.yml
    with:
      artifact: site
