name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "stories/**"
      - "discoveries/**"
      - "ubiquitous/**"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2.0.0
        with:
          mdbook-version: latest

      # mdBook docs -> site root (https://boykush.github.io/livt/)
      - name: Build docs
        run: mdbook build docs

      # livt build -> /demo subpath (https://boykush.github.io/livt/demo/)
      - name: Build livt site
        run: go run . build -o dist

      - name: Assemble site
        run: |
          mkdir -p _site/demo
          cp -r docs/book/. _site/
          cp -r dist/. _site/demo/

      # v4.0.0+ pins its internal actions/upload-artifact to a SHA, satisfying
      # the repo's "pin actions to a full-length SHA" policy (v3 did not).
      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
