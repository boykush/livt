name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege by default; the job grants only what it needs.
permissions: {}

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # keyless (Sigstore) signing of the build provenance
      attestations: write # persist the provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history and tags for the release changelog
          persist-credentials: false

      # Same toolchain source of truth as CI (.mise.toml). Cache is disabled:
      # restoring a cache into a job that publishes release artifacts is a
      # cache-poisoning vector (zizmor: cache-poisoning).
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go golangci-lint goreleaser
          cache: false

      # Gate the release on the same checks CI runs (fmt/vet/lint/tidy/build/test).
      - name: Check
        run: mise run check

      # gomod.proxy builds the module as the proxy serves it, and a version the
      # proxy has served once stays pinned to that commit. A tag moved after its
      # first fetch therefore publishes the old code under the new name, with
      # every check here passing on the new.
      - name: Verify the proxy serves this tag's commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          module=$(go list -m)
          want=$(git rev-parse "${TAG}^{commit}")
          # The query the build makes, so what it answers is what gets built.
          got=$(go list -m -f '{{with .Origin}}{{.Hash}}{{end}}' "${module}@${TAG}")
          if [ "$got" != "$want" ]; then
            echo "::error::the proxy serves $TAG as ${got:-a commit it will not name}, not $want. Release a new version; a moved tag cannot be re-served"
            exit 1
          fi

      - name: Build and publish release
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sigstore-signed build provenance for every artifact, verifiable with
      # `gh attestation verify <artifact> --repo boykush/livt`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
