name: automations

# The livt repository's side of the collect station: an implementation
# repository names the revision it merged, and the action ships reads it.
# repository_dispatch only ever runs the default branch's copy, so a change
# here cannot be exercised from the pull request carrying it.
on:
  repository_dispatch:
    types: [automations-rev]

permissions: {}

# The report branch is one per implementation repository, so only two
# revisions from the same one can race to rewrite it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.repository }}
  cancel-in-progress: false

jobs:
  collect:
    name: collect
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout, and read the committed report the claims are compared against
      id-token: write # assume the signing role, see the token step
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GITHUB_TOKEN cannot open the pull request — and where the setting lets
      # it, the pull request it opens starts no workflow, so the checks the
      # ruleset requires never report and it can never merge. Scoped to this
      # repository: no owner input. It is minted for every dispatch now, since
      # whether a pull request is warranted is decided inside the action.
      - name: Generate the repo-writer App token
        id: app-token
        uses: boykush/workflows/.github/actions/github-app-token@3894c6635a206c357bb1cbf35c99460f8773c54f
        with:
          app: repo-writer
          permission-contents: write
          permission-pull-requests: write

      # Every participating repository is public here, so no read credential is
      # passed; a private one would hand the action a read-token and nothing
      # about the rest of this job would change.
      - name: Collect
        uses: $/actions/collect
        with:
          repository: ${{ github.event.client_payload.repository }}
          rev: ${{ github.event.client_payload.rev }}
          token: ${{ steps.app-token.outputs.token }}
