name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; the job grants only what it needs.
permissions: {}

# Cancel superseded runs on the same ref (e.g. successive pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs Go and golangci-lint at the versions pinned in .mise.toml — the
      # same source of truth the local pre-commit hooks (hk) use. install_args
      # limits the install to these two tools (not node/mdBook/pkl/hk), keeping
      # the job lean. mise-action caches the installed tools across runs.
      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install_args: go golangci-lint

      - name: Cache Go build & module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # Every check runs through a mise task from .mise.toml, so CI and the local
      # hk pre-commit hooks share one definition and can't drift. Steps stay
      # separate (rather than one `mise run check`) for per-check CI status.
      - name: Format (gofmt)
        run: mise run fmt

      - name: Vet
        run: mise run vet

      - name: Lint (golangci-lint)
        run: mise run lint

      - name: Tidy (go.mod / go.sum)
        run: mise run tidy

      - name: Build
        run: mise run build

      # go test -race — the gap the pre-commit hooks don't cover.
      - name: Test
        run: mise run test
