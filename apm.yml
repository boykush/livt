name: livt
version: 0.1.0
description: Agent config for working in this repository
targets:
  - claude
  - codex
# apm install generates .mcp.json and .codex/config.toml from this file; don't edit them by hand.
dependencies:
  apm:
    - boykush/ai-plugins/plugins/adr-remote-mcp#3631b08cd0fd77c73af1d53706d5af4e7a5064e2
  mcp:
    - name: playwright
      registry: false
      transport: stdio
      command: npx
      args:
        - "@playwright/mcp@0.0.70"
