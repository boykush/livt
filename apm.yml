name: livt
version: 0.1.0
description: Agent config for working in this repository
targets:
  - claude
  - codex
# apm install generates .mcp.json and .codex/config.toml from this file; don't edit them by hand.
dependencies:
  apm:
    - boykush/ai-plugins/plugins/adr-remote-mcp#b5087bb58421145cb6289560f31e72da53f22207
    - ./plugins/livt-discovery/skills/preview-changes
  mcp:
    - name: playwright
      registry: false
      transport: stdio
      command: npx
      args:
        - "@playwright/mcp@0.0.70"
