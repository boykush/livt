name: livt
version: 0.1.0
description: Agent config for working in this repository
targets:
  - claude
  - codex
# apm install generates .mcp.json and .codex/config.toml from this file; don't edit them by hand.
dependencies:
  apm:
    - boykush/adr/plugins/adr-remote-mcp#0ace14215204963afc46838a03502819e705c4c4 # adr-remote-mcp--v0.1.0
    - ./plugins/livt-discovery/skills/preview-changes
  mcp:
    - name: playwright
      registry: false
      transport: stdio
      command: npx
      args:
        - "@playwright/mcp@0.0.70"
