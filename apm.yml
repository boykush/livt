name: livt
version: 0.1.0
description: Agent config for working in this repository
targets:
  - claude
  - codex
# apm install generates .mcp.json and .codex/config.toml from this file; don't edit them by hand.
dependencies:
  apm:
    - boykush/ai-plugins/plugins/adr-remote-mcp#6a5c170fc4662cb4c6ea4db605a396c70f3c1894
  mcp:
    - name: playwright
      registry: false
      transport: stdio
      command: npx
      args:
        - "@playwright/mcp@0.0.70"
