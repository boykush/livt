name: livt
version: 0.1.0
description: Agent config for working in this repository
targets:
  - claude
  - codex
# apm install generates .mcp.json and .codex/config.toml from this file; don't edit them by hand.
dependencies:
  apm:
    - boykush/ai-plugins/plugins/adr-remote-mcp#f7ca0cfd7a097a713c7fd23f1d313111c6e8993c
  mcp:
    - name: playwright
      registry: false
      transport: stdio
      command: npx
      args:
        - "@playwright/mcp@0.0.70"
